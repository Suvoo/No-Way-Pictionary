# One command runs everything: `make up` (or `docker compose up --build`), then open http://localhost:8080
# - no .env or no TAVUS_API_KEY: demo mode (the full game with typed guesses, no video)
# - TAVUS_API_KEY in .env: live mode; the server creates or updates Pip on Tavus by itself at startup
services:
  app:
    build: .
    ports:
      - "8080:8000"
    environment:
      OPEN_URL: http://localhost:8080   # printed in the logs once the app is up
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data   # SQLite game history survives restarts
    restart: unless-stopped
