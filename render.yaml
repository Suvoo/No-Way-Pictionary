# Render Blueprint: New > Blueprint > pick this repo. Only TAVUS_API_KEY needs a value (empty = demo mode).
# TAVUS_PAL_ID is optional (the server finds or creates Pip at startup); PUBLIC_URL defaults to Render's own URL.
services:
  - type: web
    name: doodle-with-pip
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TAVUS_API_KEY
        sync: false
      - key: TAVUS_PAL_ID
        sync: false
      - key: TAVUS_FACE_ID
        sync: false
      - key: TAVUS_CALLBACK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
